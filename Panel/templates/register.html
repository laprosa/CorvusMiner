<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - CorvusMiner Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            min-height: 100vh;
            padding: 2rem 1.25rem;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: linear-gradient(145deg, rgba(38, 38, 38, 0.98), rgba(30, 30, 30, 0.98));
            border: 1px solid var(--border);
            border-top: 2px solid var(--border-strong);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .auth-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
            color: var(--text);
            text-decoration: none;
        }

        .auth-brand span {
            display: grid;
            line-height: 1.1;
        }

        .auth-brand strong {
            font-size: 1rem;
            font-weight: 700;
        }

        .auth-brand small {
            margin-top: 0.3rem;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .auth-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .auth-title svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        .auth-sub {
            margin: 0.4rem 0 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .auth-notice {
            margin-bottom: 1.5rem;
            padding: 0.7rem 0.85rem;
            color: var(--text-soft);
            font-size: 0.78rem;
            line-height: 1.45;
            background: rgba(170, 0, 0, 0.08);
            border-left: 3px solid var(--accent);
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        .auth-notice strong {
            color: var(--accent-strong);
        }

        .auth-field {
            display: block;
            margin-bottom: 1rem;
        }

        .auth-field span {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-soft);
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .auth-field input {
            width: 100%;
        }

        .auth-hint {
            display: block;
            margin-top: 0.35rem;
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        .auth-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            margin-top: 1.5rem;
        }

        .auth-submit svg {
            width: 16px;
            height: 16px;
        }

        .auth-foot {
            margin: 1.5rem 0 0;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        .auth-foot a {
            color: var(--accent-strong);
            font-weight: 500;
            text-decoration: none;
        }

        .auth-foot a:hover {
            text-decoration: underline;
        }

        .auth-quote {
            max-width: 400px;
            margin: 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="auth-shell">
        <div class="auth-card">
            <a class="auth-brand" href="/">
                <img src="/static/img/logo.jpg" alt="" class="navbar-logo">
                <span>
                    <strong>Corvus</strong>
                    <small>Control panel</small>
                </span>
            </a>

            <h1 class="auth-title"><i data-lucide="user-plus"></i>Create account</h1>
            <p class="auth-sub">Set up the panel administrator.</p>

            <div class="auth-notice">
                <strong>Important:</strong> Only one account can be registered. Choose your credentials carefully.
            </div>

            <form method="POST" action="/register">
                <label class="auth-field" for="username">
                    <span>Username</span>
                    <input type="text" id="username" name="username" required autocomplete="username" autofocus>
                </label>
                <label class="auth-field" for="password">
                    <span>Password</span>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
                    <small class="auth-hint">Minimum 8 characters.</small>
                </label>
                <button type="submit" class="btn btn-primary auth-submit">
                    Create account<i data-lucide="arrow-right"></i>
                </button>
            </form>

            <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
        </div>

        {{if .quote}}<footer class="auth-quote">{{.quote}}</footer>{{end}}
    </main>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.8 } });
    </script>
</body>
</html>
